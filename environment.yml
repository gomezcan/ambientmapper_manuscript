# Conda environment for ambientmapper-manuscript
# Pins all tool versions used to generate manuscript figures
#
# Usage: conda env create -f environment.yml
#        conda activate ambientmapper-manuscript
#
# Versions follow SOFTWARE_VERSIONS.md. The SEACells meta-cell step uses a separate
# Python 3.10 environment created by workflows/05_qc_and_embedding/setup/0_10_install_seacells_env.sh.

name: ambientmapper-manuscript
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # --- Core Python ---
  - python=3.12
  - pip

  # --- Data analysis ---
  - numpy=1.26.4
  - pandas=2.1.4
  - scipy=1.14.1

  # --- Plotting (Python) ---
  - matplotlib=3.9.2
  - seaborn=0.13.2

  # --- Bioinformatics (pipeline) ---
  - samtools=1.22
  - bcftools=1.22
  - bedtools=2.31.1
  - bwa=0.7.17
  - macs3=3.0.2
  - macs2=2.2.4
  - seqkit=2.9.0
  - pigz=2.8
  - minimap2=2.14
  - ucsc-wigtobigwig
  - pygenometracks=3.9
  - cutadapt=5.1
  - fastp=0.24.0
  - umi_tools=1.1.6
  - pysam=0.23.3
  - pybedtools=0.12.0
  - sra-tools=3.2.1

  # --- R + key packages ---
  - r-base=4.3.3
  - r-tidyverse=2.0.0
  - r-ggplot2=3.5.1
  - r-patchwork=1.3.0
  - r-data.table=1.15.4
  - r-scales=1.3.0
  - r-viridis=0.6.5
  - r-ggpubr=0.6.0
  - r-ggrepel=0.9.6
  - r-cowplot=1.1.3
  - r-jsonlite=1.8.9
  - r-optparse
  - r-corrplot=0.95
  - r-harmony=1.2.3
  - r-uwot=0.2.2
  - r-irlba=2.3.5.1
  - r-matrix.utils=0.9.8
  - leidenalg=0.10.2
  - r-seurat=5.2.1
  # Socrates 0.0.1 (github.com/plantformatics/Socrates, commit 65077b2) is installed from GitHub, see workflows/05_qc_and_embedding/README.md

  # --- Perl (BAM processing scripts) ---
  - perl=5.32.1

  # --- Python tools (pip) ---
  - pip:
    - ambientmapper==0.1.0
    - scifi-demux==0.1.3
    - duckdb==1.5.1
    - typer==0.16.1
